<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#132844"><title>PUICSA 活動報名</title><link rel="stylesheet" href="./style.css"></head><body class="registration-body"><main class="registration-card"><div class="brand-mark">P</div><p class="eyebrow">PROVIDENCE UNIVERSITY · PUICSA</p><h1 id="event-title">活動報名</h1><div class="event-summary" id="event-info">正在載入活動資訊…</div><form id="registration-form" method="post" action="#" hidden><label>參加者姓名<input name="p_name" autocomplete="name" maxlength="80" required></label><label>學號<input name="p_student_id" maxlength="30" required></label><label>電子郵件<input name="p_email" type="email" autocomplete="email" maxlength="150" required></label><input type="text" name="p_hp" aria-hidden="true" tabindex="-1" class="hp" autocomplete="off"><button class="primary" id="register-btn" type="submit">確認報名</button></form><p id="register-message" role="status" aria-live="polite"></p><div class="footnote">資料僅供本次活動報名、通知與簽到使用，由系學會授權幹部管理。請勿在非官方頁面提供資料。</div></main><script>document.addEventListener('submit',e=>{if(e.target.id==='registration-form')e.preventDefault()},true)</script><script defer src="./register.js?v=20261020-v2"></script></body></html>
