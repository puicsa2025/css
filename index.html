document.addEventListener('submit', function(event) {

(function(){
  try {
    const u = new URL(location.href);
    const sensitive = ['email','password','passwd','pwd','access_token','refresh_token'];
    const found = sensitive.some(k=>u.searchParams.has(k));
    if(found){
      sensitive.forEach(k=>u.searchParams.delete(k));
      history.replaceState(null,'',u.pathname+(u.search?'?'+u.searchParams.toString():'')+u.hash);
    }
  } catch {}
})();
